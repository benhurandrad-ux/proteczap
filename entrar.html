<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js?v=1"></script>
<script src="core.js?v=1"></script>
</head>
<body>
<main class="auth" id="auth">
  <form class="card" id="f" novalidate>
    <div class="logo"><span data-brand-logo><span class="mark" data-brand-initial>P</span></span><span class="cname" data-brand-name>ProtecZap</span></div>
    <h1 id="title">Criar acesso</h1>
    <p class="sub" id="sub">Verificando o convite</p>
    <div class="warn-box hide" id="warn"></div>
    <div id="form-body" class="hide" style="display:flex;flex-direction:column;gap:14px">
      <div class="field">
        <label for="name">Seu nome</label>
        <input class="input" id="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input class="input" id="email" type="email" autocomplete="username" readonly>
        <span class="help">O convite foi feito para este e-mail.</span>
      </div>
      <div class="field">
        <label for="phone">Seu WhatsApp</label>
        <input class="input mono" id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(31) 98215-3370" required>
        <span class="help">É para este número que vai o aviso de lead novo. Confira com atenção.</span>
      </div>
      <div class="field" id="pwd-field">
        <label for="pwd">Crie uma senha (mínimo 8 caracteres)</label>
        <input class="input" id="pwd" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn lg primary block" type="submit" id="go">Criar acesso e entrar</button>
      <p class="help muted" style="text-align:center;font-size:12px">Ao entrar você aceita o uso do sistema conforme as regras da sua empresa.</p>
    </div>
    <div class="foot-links" id="links" style="justify-content:center"><a class="link" id="login-link" href="login.html">Já tenho acesso</a></div>
  </form>
  <p class="powered" data-powered>powered by ProtecZap</p>
</main>
<script>
(async () => {
  const { $, sb, configured, errMsg, href, busy, offlineBanner, resolveBranding, maskPhoneInput, phoneDigits, fmtPhone } = window.pz;
  await resolveBranding();
  $('#login-link').href = href('login.html');
  maskPhoneInput($('#phone'));

  const token = new URLSearchParams(location.search).get('token');
  if (!configured) {
    offlineBanner($('#auth'));
    $('#sub').textContent = 'Convite indisponível sem conexão com o banco.';
    $('#form-body').classList.remove('hide'); $('#go').disabled = true;
    return;
  }
  if (!token) {
    $('#sub').textContent = 'Este link não tem convite. Peça ao gestor da sua empresa um novo link de acesso.';
    return;
  }
  const { data: info, error } = await sb.rpc('invite_info', { p_token: token });
  if (error || !info || !info.valid) {
    $('#sub').textContent = 'Convite inválido, usado ou expirado. Peça um novo link ao gestor.';
    return;
  }
  $('#title').textContent = 'Acesso à ' + (info.company_name || 'empresa');
  $('#sub').textContent = `Você foi convidado como ${info.profile_name || 'membro'}. Crie seu acesso abaixo.`;
  $('#email').value = info.email || '';
  $('#name').value = info.full_name || '';
  $('#form-body').classList.remove('hide');

  /* Já logado com o mesmo e-mail: só aceita o convite */
  const { data: { session } } = await sb.auth.getSession();
  let logged = session && session.user && session.user.email && session.user.email.toLowerCase() === (info.email || '').toLowerCase();
  if (session && !logged) {
    $('#warn').textContent = `Você está logado com ${session.user.email}. Este convite é para ${info.email}. Saia e entre com o e-mail certo.`;
    $('#warn').classList.remove('hide');
    $('#go').textContent = 'Sair desta conta';
    $('#go').onclick = async e => { e.preventDefault(); await sb.auth.signOut(); location.reload(); };
    return;
  }
  if (logged) { $('#pwd-field').classList.add('hide'); $('#pwd').required = false; $('#go').textContent = 'Entrar na empresa'; }

  $('#f').addEventListener('submit', async e => {
    e.preventDefault(); $('#err').textContent = '';
    const phone = phoneDigits($('#phone').value);
    if (!/^[0-9]{12,13}$/.test(phone)) { $('#err').textContent = 'Número incompleto. Use DDD + número, ex.: (31) 98215-3370.'; $('#phone').focus(); return; }
    if (!logged && $('#pwd').value.length < 8) { $('#err').textContent = 'A senha precisa ter pelo menos 8 caracteres.'; $('#pwd').focus(); return; }
    busy($('#go'), true, 'Criando acesso');
    if (!logged) {
      const email = $('#email').value.trim().toLowerCase(), password = $('#pwd').value;
      const { data, error: e1 } = await sb.auth.signUp({ email, password, options: { data: { full_name: $('#name').value.trim(), phone } } });
      if (e1) {
        if (/already registered/i.test(e1.message)) {
          /* Conta já existe: tenta entrar com a senha digitada */
          const { error: e2 } = await sb.auth.signInWithPassword({ email, password });
          if (e2) { busy($('#go'), false); $('#err').textContent = 'Este e-mail já tem conta. Entre com a senha dela ou use "Esqueci a senha" na tela de login.'; return; }
        } else { busy($('#go'), false); $('#err').textContent = errMsg(e1); return; }
      } else if (!data.session) {
        const { error: e3 } = await sb.auth.signInWithPassword({ email, password });
        if (e3) { busy($('#go'), false); $('#err').textContent = 'Confirme seu e-mail (cheque a caixa de entrada) e abra este link de novo.'; return; }
      }
    }
    const { data: res, error: e4 } = await sb.rpc('accept_invite', { p_token: token, p_phone: phone });
    if (e4) { busy($('#go'), false); $('#err').textContent = errMsg(e4); return; }
    /* Fora do domínio da plataforma, guarda o slug para as próximas telas */
    try { if (res && res.slug && window.pz.inFallback) localStorage.setItem('pz_empresa', res.slug); } catch (er) { /* sem storage */ }
    const dest = (res && res.slug && window.pz.inFallback) ? 'index.html?empresa=' + encodeURIComponent(res.slug) : href('index.html');
    location.replace(dest);
  });
})();
</script>
</body>
</html>
