<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ProtecZap</title>
<style>body{font-family:Inter,system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4f1;color:#52514e;font-size:14px;text-align:center;padding:24px}b{color:#0b0b0b}a{color:inherit}</style>
</head>
<body>
<!-- GitHub Pages serve este arquivo para qualquer caminho inexistente. Reescreve /c/<id> (deep link do aviso de lead) para c.html?id=<id>,
     mantendo ?empresa= quando existir. Qualquer outro caminho mostra a mensagem abaixo. -->
<div id="p"><b>Página não encontrada.</b><br><a href="./">Ir para o início</a></div>
<script>
(function () {
  var m = /\/c\/([0-9a-f-]{36})\/?$/i.exec(location.pathname);
  if (!m) return;
  var q = new URLSearchParams(location.search); q.set('id', m[1]);
  var base = location.pathname.replace(/\/c\/[0-9a-f-]{36}\/?$/i, '/');
  location.replace(base + 'c.html?' + q.toString());
})();
</script>
</body>
</html>
